name: Signal Bot

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub may delay runs a few minutes)
  workflow_dispatch:
    inputs:
      mode:
        description: "scan = normal run, test = send a Telegram test message"
        default: scan
        type: choice
        options: [scan, test]

concurrency:
  group: signal-bot
  cancel-in-progress: false

permissions:
  contents: write   # to commit the daily report

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: signal-bot
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      BOT_TIMEZONE: ${{ vars.BOT_TIMEZONE || 'UTC' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: signal-bot/requirements.txt

      - run: pip install -r requirements.txt

      - name: Telegram test
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'test'
        run: python -m bot.main --test

      - name: Restore bot memory
        if: github.event_name == 'schedule' || inputs.mode == 'scan'
        uses: actions/cache/restore@v4
        with:
          path: signal-bot/state
          key: bot-state-${{ github.run_id }}
          restore-keys: bot-state-

      - name: Scan markets and send signals
        if: github.event_name == 'schedule' || inputs.mode == 'scan'
        run: python -m bot.main

      - name: Save bot memory
        if: always() && (github.event_name == 'schedule' || inputs.mode == 'scan')
        uses: actions/cache/save@v4
        with:
          path: signal-bot/state
          key: bot-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Commit daily report
        if: github.event_name == 'schedule' || inputs.mode == 'scan'
        run: |
          if [ -n "$(git status --porcelain reports 2>/dev/null)" ]; then
            git config user.name "signal-bot"
            git config user.email "signal-bot@users.noreply.github.com"
            git add reports
            git commit -m "Daily signal report"
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push
          fi
